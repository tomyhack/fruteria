<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-title="tituloTienda">Frutería Nancy | Tienda</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/store.css">
    <link rel="stylesheet" href="../css/media.css">
</head>
<body>
    <header class="encabezado-sitio">
        <div class="contenido-encabezado">
            <div class="logo-sitio">
                <img class="imagen-logo-sitio" src="../img/jpeg/logo.jpeg" alt="Frutería Nancy">
            </div>
            <nav class="navegacion-principal">
                <a class="enlace-navegacion" href="index.html" data-i18n="navInicio">Inicio</a>
                <a class="enlace-navegacion enlace-navegacion-activo" href="store.html" data-i18n="navTienda">Tienda</a>
                <a class="enlace-navegacion" href="support.html" data-i18n="navSoporte">Soporte</a>
            </nav>
            <div class="acciones-encabezado">
                <a class="boton-carrito" href="cart.html">🛒 <span data-i18n="etiquetaCarrito">Carrito</span><span id="contador-carrito" class="contador-carrito">0</span></a>
                <div class="menu-perfil">
                    <button id="boton-menu-perfil" class="boton-menu-perfil" type="button" aria-expanded="false" aria-controls="lista-menu-perfil">👤 <span data-i18n="perfil">Perfil</span></button>
                    <div id="lista-menu-perfil" class="lista-menu-perfil"></div>
                </div>
                <button id="boton-idioma" class="boton-idioma" type="button" onclick="cambiarIdioma()">EN</button>
            </div>
        </div>
    </header>

    <main class="contenido-pagina">
        <section class="seccion-contenido">
            <div class="encabezado-seccion">
                <h1 data-i18n="productosTitulo">Productos</h1>
                <p data-i18n="productosIntro">Elige los productos que quieras agregar al carrito.</p>
            </div>
            <p id="mensaje-carrito" class="aviso-carrito" role="status" aria-live="polite"></p>
            <div id="cuadricula-productos" class="cuadricula-productos"></div>
        </section>
    </main>

    <footer class="pie-sitio">
        <p data-i18n="textoPie">Frutería | Entrega de frutas frescas y tienda en línea.</p>
    </footer>
    <script src="../js/translations.js"></script>
    <script src="../js/tienda.js"></script>
</body>
</html>
