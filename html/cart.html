<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-title="carrito">Frutería Nancy | Carrito</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/cart.css">
    <link rel="stylesheet" href="../css/media.css">
</head>
<body>
    <header class="encabezado-sitio">
        <div class="contenido-encabezado">
            <div class="logo-sitio">
                <img class="imagen-logo-sitio" src="../img/jpeg/logo.jpeg" alt="Frutería Nancy">
            </div>
            <nav class="navegacion-principal" data-i18n-block="navegacionCarrito">
                <a class="enlace-navegacion" href="index.html">Inicio</a>
                <a class="enlace-navegacion" href="store.html">Tienda</a>
                <a class="enlace-navegacion" href="support.html">Soporte</a>
            </nav>
            <div class="acciones-encabezado" data-i18n-block="accionesEncabezado">
                <a class="boton-carrito" href="cart.html">🛒 <span>Carrito</span><span id="contador-carrito" class="contador-carrito">0</span></a>
                <div class="menu-perfil">
                    <button id="boton-menu-perfil" class="boton-menu-perfil" type="button" aria-expanded="false" aria-controls="lista-menu-perfil">👤 Perfil</button>
                    <div id="lista-menu-perfil" class="lista-menu-perfil">
                        <a href="login.html">Iniciar sesión</a>
                        <a href="register.html">Registrarte</a>
                        <a href="../php/logout.php">Cerrar sesión</a>
                    </div>
                </div>
                <button id="boton-idioma" class="boton-idioma" type="button" onclick="cambiarIdioma()">EN</button>
            </div>
        </div>
    </header>

    <main class="contenido-pagina" data-i18n-block="contenidoCarrito">
        <section class="seccion-contenido">
            <div class="encabezado-seccion">
                <h1>Carrito</h1>
                <p>Revisa tus productos antes de comprar.</p>
            </div>
            <p id="retroalimentacion-carrito" class="mensaje-confirmacion" role="status" aria-live="polite"></p>
            <div id="lista-carrito" class="lista-carrito"></div>
            <div id="resumen-carrito" class="resumen-carrito">
                <p>Total: $<span id="total-carrito">0</span></p>
                <button id="boton-comprar" class="boton-principal" type="button">Comprar todo</button>
            </div>
        </section>
    </main>

    <footer class="pie-sitio" data-i18n-block="piePagina">
        <p>Frutería | Entrega de frutas frescas y tienda en línea.</p>
    </footer>
    <script src="../js/translations.js"></script>
    <script src="../js/tienda.js"></script>
</body>
</html>
