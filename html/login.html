<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frutería Nancy | Iniciar sesión</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/media.css">
</head>
<body>
    <main class="auth-page">
        <!-- Este formulario envía el usuario y la contraseña a login.php. -->
        <form class="auth-card auth-form" action="../php/login.php" method="post">
            <div class="auth-language-control">
                <button id="lang-btn" class="language-toggle" type="button" onclick="toggleLanguage()">EN</button>
            </div>

            <div class="brand" data-i18n-block="loginBrand">
                <h1>Frutería Nancy</h1>
                <p>Productos de producción propia.</p>
                <a class="back-link" href="index.html">← Volver a la tienda</a>
            </div>

            <div data-i18n-block="loginTitle">
                <h2>Iniciar sesión</h2>
            </div>
            <div data-i18n-block="loginUser">
                <label for="username">Usuario</label>
                <input id="username" type="text" name="username" placeholder="Ingrese su usuario" required>
            </div>
            <div data-i18n-block="loginPassword">
                <label for="password">Contraseña</label>
                <input id="password" type="password" name="password" placeholder="Ingrese su contraseña" minlength="8" maxlength="16" required>
            </div>
            <div data-i18n-block="loginButton">
                <button type="submit" class="primary-btn">Ingresar</button>
            </div>
            <div id="feedback" class="message"></div>
            <div data-i18n-block="loginSwitch">
                <p class="auth-switch">¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>.</p>
            </div>
        </form>
    </main>

    <script src="../js/translations.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
