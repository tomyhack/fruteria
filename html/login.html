<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frutería Nancy | Iniciar sesión</title>
    <link rel="stylesheet" href="../css/login.css" />
</head>
<body>

    <main class="auth-page">
        <div class="auth-card">

            <div class="brand">
                <h1>Frutería Nancy</h1>
                <p>Productos de producción propia.</p>
            </div>

            <div class="tab-buttons">
                <button id="loginTab" class="tab active">Iniciar sesión</button>
                <button id="registerTab" class="tab">Registrarse</button>
            </div>

            <div class="form-container">

                <form id="loginForm" class="auth-form" novalidate>

                    <label for="loginUsername">Usuario</label>
                    <input id="loginUsername" type="text" placeholder="Ingrese su usuario" required>

                    <label for="loginPassword">Contraseña</label>
                    <input id="loginPassword" type="password" placeholder="Ingrese su contraseña" required>

                    <button type="submit" class="primary-btn">Ingresar</button>

                </form>

                <form id="registerForm" class="auth-form hidden" novalidate>

                    <label for="registerUsername">Usuario</label>
                    <input id="registerUsername" type="text" placeholder="Elija un nombre de usuario" required>

                    <label for="registerEmail">Correo electrónico</label>
                    <input id="registerEmail" type="email" placeholder="Ingrese su correo" required>

                    <label for="registerPassword">Contraseña</label>
                    <input id="registerPassword" type="password" placeholder="Cree una contraseña" required>

                    <button type="submit" class="primary-btn">Crear cuenta</button>

                </form>

            </div>

            <p id="message" class="message"></p>

        </div>
    </main>

<script>

const loginTab = document.getElementById('loginTab');
const registerTab = document.getElementById('registerTab');
const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');
const message = document.getElementById('message');

function showMessage(text, success = true) {

    message.textContent = text;
    message.className = 'message ' + (success ? 'success' : 'error');

}

function toggleForm(activeTab) {

    if (activeTab === 'login') {

        loginTab.classList.add('active');
        registerTab.classList.remove('active');

        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');

    } else {

        registerTab.classList.add('active');
        loginTab.classList.remove('active');

        registerForm.classList.remove('hidden');
        loginForm.classList.add('hidden');

    }

}

function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

loginTab.addEventListener('click', () => toggleForm('login'));
registerTab.addEventListener('click', () => toggleForm('register'));

loginForm.addEventListener('submit', (event) => {

    event.preventDefault();

    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;

    if (!username || !password) {
        showMessage('Completa usuario y contraseña para continuar.', false);
        return;
    }

    showMessage('¡Inicio de sesión correcto! Redirigiendo...', true);

    setTimeout(() => {
        window.location.href = 'main.html';
    }, 1000);

});

registerForm.addEventListener('submit', (event) => {

    event.preventDefault();

    const username = document.getElementById('registerUsername').value.trim();
    const email = document.getElementById('registerEmail').value.trim();
    const password = document.getElementById('registerPassword').value;

    if (!username || !email || !password) {
        showMessage('Completa todos los campos para registrarte.', false);
        return;
    }

    showMessage('¡Registro exitoso! Ya puedes iniciar sesión.', true);

    loginForm.reset();
    registerForm.reset();

    toggleForm('login');

});

</script>

</body>
</html>
