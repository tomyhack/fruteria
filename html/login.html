<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frutería Nancy | Iniciar sesión</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/media.css">
</head>
<body>
    <main class="auth-page">
        <!-- El formulario valida el acceso contra login.php. -->
        <form class="auth-card auth-form" action="../php/login.php" method="POST">
            <div class="auth-language-control">
                <button class="language-toggle" type="button" data-language-toggle aria-label="Cambiar idioma a Inglés" title="Cambiar idioma a Inglés">EN</button>
            </div>
            <div class="brand">
                <h1>Frutería Nancy</h1>
                <p>Productos de producción propia.</p>
                <a class="back-link" href="main.html">← Volver a la tienda</a>
            </div>

            <h2>Iniciar sesión</h2>

            <label for="username">Usuario</label>
            <input id="username" type="text" name="username" placeholder="Ingrese su usuario" required>

            <label for="password">Contraseña</label>
            <!-- La validación de longitud se repite en el servidor para seguridad. -->
            <input id="password" type="password" name="password" placeholder="Ingrese su contraseña" minlength="8" maxlength="16" required>

            <button type="submit" class="primary-btn">Ingresar</button>
            <div id="feedback" class="message"></div>

            <p class="auth-switch">¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>.</p>
        </form>
    </main>

    <script src="../js/translate.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
