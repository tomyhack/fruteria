<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-title="registro">Frutería Nancy | Registrarse</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/media.css">
</head>
<body>
    <main class="authentication-page">
        <form id="registration-form" class="authentication-card authentication-form" action="../php/register.php" method="post" data-i18n-block="formularioRegistro">
            <div class="top-actions"><button id="language-button" class="language-button" type="button" onclick="cambiarIdioma()">EN</button></div>
            <div class="authentication-brand"><img class="authentication-logo" src="../img/jpeg/logo.jpeg" alt="Frutería Nancy"><p>Productos de producción propia.</p><a class="back-link" href="index.html">← Volver a la tienda</a></div>
            <h1>Registrarse</h1>
            <label for="username">Usuario</label>
            <input id="username" type="text" name="username" placeholder="Elija un usuario" required>
            <label for="email">Correo electrónico</label>
            <input id="email" type="email" name="email" placeholder="nombre@correo.com" required>
            <label for="password">Contraseña</label>
            <input id="password" type="password" name="password" placeholder="Cree una contraseña" minlength="8" maxlength="16" required>
            <button type="submit" class="primary-button">Crear cuenta</button>
            <div id="feedback" class="feedback-message"></div>
            <p class="account-switch">¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>.</p>
        </form>
    </main>
    <script src="../js/translations.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
