<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frutería Nancy | Registrarse</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/media.css">
</head>
<body>
    <main class="auth-page">
        <!-- Este formulario crea una cuenta mediante register.php. -->
        <form id="registerForm" class="auth-card auth-form" action="../php/register.php" method="post">
            <div class="auth-language-control">
                <button id="lang-btn" class="language-toggle" type="button" onclick="toggleLanguage()">EN</button>
            </div>

            <div class="brand" data-i18n-block="registerBrand">
                <h1>Frutería Nancy</h1>
                <p>Productos de producción propia.</p>
                <a class="back-link" href="index.html">← Volver a la tienda</a>
            </div>

            <div data-i18n-block="registerTitle">
                <h2>Registrarse</h2>
            </div>
            <div data-i18n-block="registerUser">
                <label for="username">Usuario</label>
                <input id="username" type="text" name="username" placeholder="Elija un usuario" required>
            </div>
            <div data-i18n-block="registerPassword">
                <label for="password">Contraseña</label>
                <input id="password" type="password" name="password" placeholder="Cree una contraseña" minlength="8" maxlength="16" required>
            </div>
            <div data-i18n-block="registerButton">
                <button type="submit" class="primary-btn">Crear cuenta</button>
            </div>
            <div id="feedback" class="message"></div>
            <div data-i18n-block="registerSwitch">
                <p class="auth-switch">¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>.</p>
            </div>
        </form>
    </main>

    <script src="../js/translations.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
