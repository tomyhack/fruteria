<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-title="registro">Frutería Nancy | Registrarse</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/media.css">
</head>
<body>
    <main class="pagina-autenticacion">
        <form id="formulario-registro" class="tarjeta-autenticacion formulario-autenticacion" action="../php/register.php" method="post" data-i18n-block="formularioRegistro">
            <div class="acciones-superiores"><button id="boton-idioma" class="boton-idioma" type="button" onclick="cambiarIdioma()">EN</button></div>
            <div class="marca-autenticacion"><img class="logo-autenticacion" src="../img/jpeg/logo.jpeg" alt="Frutería Nancy"><p>Productos de producción propia.</p><a class="enlace-regreso" href="index.html">← Volver a la tienda</a></div>
            <h1>Registrarse</h1>
            <label for="username">Usuario</label>
            <input id="username" type="text" name="username" placeholder="Elija un usuario" required>
            <label for="email">Correo electrónico</label>
            <input id="email" type="email" name="email" placeholder="nombre@correo.com" required>
            <label for="password">Contraseña</label>
            <input id="password" type="password" name="password" placeholder="Cree una contraseña" minlength="8" maxlength="16" required>
            <button type="submit" class="boton-principal">Crear cuenta</button>
            <div id="retroalimentacion" class="mensaje-retroalimentacion"></div>
            <p class="cambio-cuenta">¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>.</p>
        </form>
    </main>
    <script src="../js/translations.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
