<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frutería Nancy | Registrarse</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/media.css">
</head>
<body>
    <main class="auth-page">
        <!-- El formulario envía los datos a register.php para crear el usuario. -->
        <form id="registerForm" class="auth-card auth-form" action="../php/register.php" method="POST">
            <div class="auth-language-control">
                <button class="language-toggle" type="button" data-language-toggle aria-label="Cambiar idioma a Inglés" title="Cambiar idioma a Inglés">EN</button>
            </div>
            <div class="brand">
                <h1>Frutería Nancy</h1>
                <p>Productos de producción propia.</p>
                <a class="back-link" href="main.html">← Volver a la tienda</a>
            </div>

            <h2>Registrarse</h2>

            <label for="username">Usuario</label>
            <input id="username" type="text" name="username" placeholder="Elija un usuario" required>

            <label for="password">Contraseña</label>
            <!-- Esta regla también se comprueba nuevamente en register.php. -->
            <input id="password" type="password" name="password" placeholder="Cree una contraseña" minlength="8" maxlength="16" required>

            <button type="submit" class="primary-btn">Crear cuenta</button>
            <div id="feedback" class="message"></div>

            <p class="auth-switch">¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>.</p>
        </form>
    </main>

    <script src="../js/translate.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
